<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cast unwrap test</title>
  <script>
    window.__onGCastApiAvailable = (available, errorInfo) => {
      window.__castSdkState = { available, errorInfo };
      window.dispatchEvent(new Event('cast-sdk-available'));
    };
  </script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 44rem; margin: 3rem auto; padding: 0 1rem; color: #18212b; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select { display: block; width: 100%; box-sizing: border-box; padding: .6rem; font: inherit; margin-top: .3rem; }
    button { padding: .65rem 1rem; margin: 1rem .5rem 0 0; font: inherit; }
    #status, #diagnostics { padding: .8rem; background: #f1f4f7; border-radius: .4rem; }
  </style>
</head>
<body>
  <h1>Cast unwrap test</h1>
  <p>Connect the registered test receiver, then play the ordinary sample followed by the wrapped sample.</p>
  <label for="appId">Google Cast receiver application ID</label>
  <input id="appId" autocomplete="off" placeholder="Enter the ID from the Cast Developer Console">
  <label for="sample">Sample</label>
  <select id="sample"><option value="normal">Ordinary video</option><option value="wrapped">Wrapped video</option></select>
  <button id="connect" disabled>Choose TV</button><button id="play" disabled>Play sample</button>
  <p id="status" role="status" aria-live="polite">Waiting for Google Cast SDK…</p>
  <p id="diagnostics">Receiver status will appear here.</p>
  <script src="./sender.js" defer></script>
</body>
</html>
